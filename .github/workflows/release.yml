name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate Release
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build (Release)
        run: swift build -c release

      - name: Run Tests
        run: swift test --parallel

  publish:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          CURRENT_TAG=${{ steps.tag.outputs.version }}
          
          echo "## What's Changed" > changelog.md
          echo "" >> changelog.md
          
          if [ "$PREV_TAG" != "$CURRENT_TAG" ] && [ -n "$PREV_TAG" ]; then
            echo "### Commits since $PREV_TAG" >> changelog.md
            echo "" >> changelog.md
            git log ${PREV_TAG}..${CURRENT_TAG} --pretty=format:"- %s (%h)" >> changelog.md
          else
            echo "### Initial Release 🎉" >> changelog.md
            echo "" >> changelog.md
            echo "First release of the Tracea iOS SDK." >> changelog.md
          fi
          
          echo "" >> changelog.md
          echo "---" >> changelog.md
          echo "" >> changelog.md
          echo "## Installation (Swift Package Manager)" >> changelog.md
          echo "" >> changelog.md
          echo '```swift' >> changelog.md
          echo "// In Xcode: File → Add Package Dependencies..." >> changelog.md
          echo "// URL: https://github.com/${{ github.repository }}.git" >> changelog.md
          echo "// Version: Up to Next Major → $CURRENT_TAG" >> changelog.md
          echo '```' >> changelog.md
          echo "" >> changelog.md
          echo "Or in \`Package.swift\`:" >> changelog.md
          echo "" >> changelog.md
          echo '```swift' >> changelog.md
          echo ".package(url: \"https://github.com/${{ github.repository }}.git\", from: \"$CURRENT_TAG\")" >> changelog.md
          echo '```' >> changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "v${{ steps.tag.outputs.version }}"
          body_path: changelog.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
