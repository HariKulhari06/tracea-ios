name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Xcode ${{ matrix.xcode }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        xcode: ['16.2']
        include:
          - xcode: '16.2'
            ios: '18.2'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

      - name: Show Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve Dependencies
        run: swift package resolve

      - name: Build Library (Debug)
        run: swift build -c debug

      - name: Build Library (Release)
        run: swift build -c release

      - name: Run Tests
        run: swift test --parallel

      - name: Build Xcode Project (iOS Simulator)
        run: |
          xcodebuild build \
            -project TraceaDemo.xcodeproj \
            -scheme TraceaDemo \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=${{ matrix.ios }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tail -20

  swiftlint:
    name: Swift Lint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SwiftLint
        run: |
          if command -v swiftlint &> /dev/null; then
            swiftlint lint --reporter github-actions-logging --quiet || true
          else
            echo "SwiftLint not installed, skipping..."
          fi
